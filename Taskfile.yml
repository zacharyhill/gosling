version: "3"

tasks:
  release:
    desc: "Tag main and push the tag. The release workflow then publishes the release. Usage: task release VERSION=0.3.0"
    requires:
      vars: [VERSION]
    vars:
      TAG: v{{.VERSION}}
      # Task evaluates vars before preconditions, so this fetch also updates
      # origin/main for the check below.
      LATEST_TAG:
        sh: git fetch --quiet --tags origin main && git tag --list 'v*' --sort=-v:refname | head -n 1
    preconditions:
      - sh: echo "{{.VERSION}}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
        msg: VERSION must look like 0.3.0, with no "v" prefix.
      - sh: '[ "$(git branch --show-current)" = main ]'
        msg: Check out main before you make a release.
      - sh: git diff --quiet HEAD
        msg: Commit or stash your changes before you make a release.
      - sh: '[ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]'
        msg: Your main does not match origin/main. Pull or push first.
      - sh: '[ "{{.LATEST_TAG}}" != "{{.TAG}}" ] && [ "$(printf "%s\n%s\n" "{{.LATEST_TAG}}" "{{.TAG}}" | sort -V | tail -n 1)" = "{{.TAG}}" ]'
        msg: VERSION must be higher than the latest tag {{.LATEST_TAG}}.
    cmds:
      - git tag "{{.TAG}}"
      - git push origin "{{.TAG}}"
