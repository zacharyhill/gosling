name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...

      # The language server tests skip without gopls.
      - name: Install gopls
        run: go install golang.org/x/tools/gopls@latest

      - run: go test ./...

      - name: Check that generated files are up to date
        run: go run ./cmd/gosling -check ./...

  vscode-extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    env:
      # The grammar tests need the Go grammar from VS Code. The runner has no
      # VS Code install, so the job downloads the grammar of a fixed release.
      VSCODE_VERSION: 1.141.0
    steps:
      - uses: actions/checkout@v5
        with:
          # The version check compares package.json with the release tags.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      # The release workflow stops when the tag and package.json differ.
      # This check finds a package.json version that is behind the latest tag.
      - name: Check that the extension version matches the lockfile and is not behind the latest tag
        run: |
          package_version="$(node -p "require('./package.json').version")"
          lock_version="$(node -p "require('./package-lock.json').version")"
          if [ "$package_version" != "$lock_version" ]; then
            echo "::error::package.json version $package_version does not match package-lock.json version $lock_version"
            exit 1
          fi
          latest_tag="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"
          if [ -z "$latest_tag" ]; then
            exit 0
          fi
          latest_version="${latest_tag#v}"
          lower_version="$(printf '%s\n%s\n' "$latest_version" "$package_version" | sort -V | head -n 1)"
          if [ "$package_version" != "$latest_version" ] && [ "$lower_version" = "$package_version" ]; then
            echo "::error::package.json version $package_version is behind the latest tag $latest_tag. Set the version to $latest_version or higher."
            exit 1
          fi

      - run: npm ci

      - name: Download the VS Code Go grammar
        run: |
          grammar="$RUNNER_TEMP/go.tmLanguage.json"
          curl -fsSL -o "$grammar" "https://raw.githubusercontent.com/microsoft/vscode/$VSCODE_VERSION/extensions/go/syntaxes/go.tmLanguage.json"
          echo "GO_GRAMMAR=$grammar" >> "$GITHUB_ENV"

      - run: npm test

      - run: npm run package
