name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...

      # The language server tests skip without gopls.
      # gopls v0.24 needs Go 1.27, so the job uses v0.23.
      - name: Install gopls
        run: go install golang.org/x/tools/gopls@v0.23.0

      - run: go test ./...

      - name: Check that generated files are up to date
        run: go run ./cmd/gosling -check ./...

  vscode-extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    env:
      # The grammar tests need the Go grammar from VS Code. The runner has no
      # VS Code install, so the job downloads the grammar of a fixed release.
      VSCODE_VERSION: 1.141.0
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - run: npm ci

      - name: Download the VS Code Go grammar
        run: |
          grammar="$RUNNER_TEMP/go.tmLanguage.json"
          curl -fsSL -o "$grammar" "https://raw.githubusercontent.com/microsoft/vscode/$VSCODE_VERSION/extensions/go/syntaxes/go.tmLanguage.json"
          echo "GO_GRAMMAR=$grammar" >> "$GITHUB_ENV"

      - run: npm test

      - run: npm run package
