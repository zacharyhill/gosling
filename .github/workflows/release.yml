name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  vscode-extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - run: npm ci

      # The tag is the only source of the release version. package.json keeps
      # the placeholder version 0.0.0.
      - name: Set the extension version from the tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - run: npm run package

      # The install command in the README downloads gosling.vsix from the
      # latest release, so the asset name must not change.
      - name: Attach gosling.vsix to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" gosling.vsix --clobber
          else
            gh release create "$GITHUB_REF_NAME" gosling.vsix --title "$GITHUB_REF_NAME" --generate-notes
          fi

      # GitHub marks a published release as latest even without assets. A draft
      # never counts as latest, so the README download keeps the last good build.
      - name: Turn the release back into a draft if the build failed
        if: failure()
        # The checkout step can fail before editors/vscode exists.
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft
          fi
